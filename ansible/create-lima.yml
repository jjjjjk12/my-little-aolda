---
- name: Create the local Lima lab
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - lima-vars.yml

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    lima_output_dir: "{{ playbook_dir }}/../lima/vm"

  tasks:
    - name: Check Lima is available
      ansible.builtin.command:
        argv:
          - limactl
          - --version
      changed_when: false

    - name: Read existing disks
      ansible.builtin.command:
        argv:
          - limactl
          - disk
          - list
          - --json
      register: disk_list
      changed_when: false

    - name: Read existing VMs
      ansible.builtin.command:
        argv:
          - limactl
          - list
          - --json
      register: vm_list
      changed_when: false

    - name: Parse Lima output
      ansible.builtin.set_fact:
        existing_disks: >-
          {{ disk_list.stdout_lines | map('from_json') | list }}
        existing_vms: >-
          {{ vm_list.stdout_lines | map('from_json') | list }}

    - name: Check existing Ceph disk sizes
      ansible.builtin.assert:
        that:
          - (item.size | int) == ((lima_ceph_disk_gib | int) * 1073741824)
        fail_msg: >-
          Disk {{ item.name }} already exists with a different size.
          No resize or deletion was performed.
      loop: "{{ existing_disks }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        item.name in
        (lima_nodes | map(attribute='name')
        | map('regex_replace', '$', '-ceph') | list)

    - name: Check existing VM CPU and memory
      ansible.builtin.assert:
        that:
          - (item.cpus | int) == (lima_cpus | int)
          - (item.memory | int) == ((lima_memory_gib | int) * 1073741824)
        fail_msg: >-
          VM {{ item.name }} already exists with different resources.
          No VM settings were changed.
      loop: "{{ existing_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name in (lima_nodes | map(attribute='name') | list)

    - name: Create the generated YAML directory
      ansible.builtin.file:
        path: "{{ lima_output_dir }}"
        state: directory
        mode: "0755"

    - name: Render Lima configuration
      ansible.builtin.template:
        src: lima-node.yaml.j2
        dest: "{{ lima_output_dir }}/{{ item.name }}.yaml"
        mode: "0644"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate generated Lima configuration
      ansible.builtin.command:
        argv:
          - limactl
          - validate
          - "{{ lima_output_dir }}/{{ item.name }}.yaml"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Create missing Ceph disks
      ansible.builtin.command:
        argv:
          - limactl
          - disk
          - create
          - "{{ item.name }}-ceph"
          - --size
          - "{{ lima_ceph_disk_gib }}GiB"
          - --format
          - raw
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}-ceph"
      when: >-
        (item.name ~ '-ceph') not in
        (existing_disks | map(attribute='name') | list)
      changed_when: true

    - name: Create missing VMs
      ansible.builtin.command:
        argv:
          - limactl
          - create
          - --tty=false
          - "--name={{ item.name }}"
          - "{{ lima_output_dir }}/{{ item.name }}.yaml"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        item.name not in
        (existing_vms | map(attribute='name') | list)
      changed_when: true

    - name: Start VMs that were not already running
      ansible.builtin.command:
        argv:
          - limactl
          - start
          - --tty=false
          - "{{ item.name }}"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        item.name not in
        (existing_vms
        | selectattr('status', 'equalto', 'Running')
        | map(attribute='name') | list)
      changed_when: true
