# Lab resource limits and explicit empty logging configuration.
nova_helm_values:
  pod:
    lifecycle:
      upgrades:
        deployments:
          rolling_update:
            max_surge: 0
            max_unavailable: 1
    replicas:
      api_metadata: 1
      osapi: 1
      conductor: 1
      scheduler: 1
      novncproxy: 1
      spiceproxy: 1
  conf:
    nova_api_uwsgi:
      uwsgi:
        processes: 1
    nova_metadata_uwsgi:
      uwsgi:
        processes: 1
    nova:
      DEFAULT:
        osapi_compute_workers: 1
        metadata_workers: 1
        log_config_append: ''
      conductor:
        workers: 1
      scheduler:
        workers: 1
nova_flavors:
- disk: 1
  name: m1.tiny
  ram: 512
  vcpus: 1
- disk: 20
  name: m1.small
  ram: 2048
  vcpus: 1
- disk: 40
  name: m1.medium
  ram: 4096
  vcpus: 2
- disk: 80
  name: m1.large
  ram: 8192
  vcpus: 4
- disk: 160
  name: m1.xlarge
  ram: 16384
  vcpus: 8
