# Small lab: central services use one replica; node agents, DB and Ceph retain three nodes.
neutron_networks:
- external: true
  mtu_size: 1500
  name: public
  port_security_enabled: true
  provider_network_type: flat
  provider_physical_network: external
  shared: true
  subnets:
  - allocation_pool_end: 192.168.120.200
    allocation_pool_start: 192.168.120.101
    cidr: 192.168.120.0/24
    enable_dhcp: false
    gateway_ip: 192.168.120.1
    name: public-subnet
neutron_helm_values:
  pod:
    lifecycle:
      upgrades:
        deployments:
          rolling_update:
            max_surge: 0
            max_unavailable: 1
    replicas:
      server: 1
      rpc_server: 1
  conf:
    neutron_api_uwsgi:
      uwsgi:
        processes: 1
    neutron_policy_server_uwsgi:
      uwsgi:
        processes: 1
    neutron:
      DEFAULT:
        log_config_append: ''
        api_workers: 1
        rpc_workers: 1
    auto_bridge_add:
      br-ex: lima1
    plugins:
      openvswitch_agent:
        ovs:
          bridge_mappings: external:br-ex
